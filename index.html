
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interativo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Quiz Interativo</h1>
            <p>Teste seus conhecimentos!</p>
        </header>

        <section id="start-screen" class="card">
            <h2>Vamos começar?</h2>
            <p>Responda às 5 perguntas e descubra sua pontuação.</p>
            <button id="start-button">Começar quiz</button>
        </section>

        <section id="quiz-screen" class="card hidden">
            <div class="info">
                <span id="question-counter"></span>
                <span>Pontos: <strong id="score">0</strong></span>
            </div>

            <div class="progress">
                <div id="progress-fill"></div>
            </div>

            <h2 id="question-text"></h2>
            <div id="answer-list"></div>
            <p id="feedback"></p>

            <button id="next-button" disabled>
                Próxima pergunta
            </button>
        </section>

        <section id="result-screen" class="card hidden">
            <h2 id="result-title">Quiz finalizado!</h2>
            <p id="result-message"></p>
            <p class="final-score" id="final-score"></p>
            <button id="restart-button">Jogar novamente</button>
        </section>
    </main>
    <script src="js/script.js" defer></script>
</body>
</html>
